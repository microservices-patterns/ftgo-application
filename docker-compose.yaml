services:
  order-service-db:
    image: eventuateio/eventuate-vanilla-postgres:0.21.0.BUILD-SNAPSHOT
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: eventuate

  consumer-service-db:
    image: eventuateio/eventuate-vanilla-postgres:0.21.0.BUILD-SNAPSHOT
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: eventuate

  kitchen-service-db:
    image: eventuateio/eventuate-vanilla-postgres:0.21.0.BUILD-SNAPSHOT
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: eventuate

  accounting-service-db:
    image: eventuateio/eventuate-vanilla-postgres:0.21.0.BUILD-SNAPSHOT
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: eventuate

  restaurant-service-db:
    image: eventuateio/eventuate-vanilla-postgres:0.21.0.BUILD-SNAPSHOT
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: eventuate

  delivery-service-db:
    image: eventuateio/eventuate-vanilla-postgres:0.21.0.BUILD-SNAPSHOT
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: eventuate

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # Listeners configuration
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      # Log directories
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Cluster ID (must be set for KRaft mode)
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg'

      # Other settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  cdc-service:
    image: eventuateio/eventuate-cdc-service:0.19.0.BUILD-SNAPSHOT
    ports:
      - "8099:8080"
    environment:
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: "KafkaLeadership"

      # Order Service database pipeline
      EVENTUATE_CDC_PIPELINE_PIPELINE1_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE1_READER: reader1
      EVENTUATE_CDC_PIPELINE_PIPELINE1_EVENTUATEDATABASESCHEMA: public

      # Reader 1 - Order Service database
      EVENTUATE_CDC_READER_READER1_TYPE: postgres-wal
      EVENTUATE_CDC_READER_READER1_DATASOURCEURL: jdbc:postgresql://order-service-db:5432/eventuate
      EVENTUATE_CDC_READER_READER1_DATASOURCEUSERNAME: postgresuser
      EVENTUATE_CDC_READER_READER1_DATASOURCEPASSWORD: postgrespw
      EVENTUATE_CDC_READER_READER1_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER1_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/order
      EVENTUATE_CDC_READER_READER1_OFFSETSTORAGETOPICNAME: order_schema.cdc_offset_store
      EVENTUATE_CDC_READER_READER1_OUTBOXID: "1"
      EVENTUATE_CDC_READER_READER1_MONITORINGSCHEMA: public
      # Consumer Service database pipeline
      EVENTUATE_CDC_PIPELINE_PIPELINE2_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE2_READER: reader2
      EVENTUATE_CDC_PIPELINE_PIPELINE2_EVENTUATEDATABASESCHEMA: public

      # Reader 2 - Consumer Service database
      EVENTUATE_CDC_READER_READER2_TYPE: postgres-wal
      EVENTUATE_CDC_READER_READER2_DATASOURCEURL: jdbc:postgresql://consumer-service-db:5432/eventuate
      EVENTUATE_CDC_READER_READER2_DATASOURCEUSERNAME: postgresuser
      EVENTUATE_CDC_READER_READER2_DATASOURCEPASSWORD: postgrespw
      EVENTUATE_CDC_READER_READER2_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER2_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/consumer
      EVENTUATE_CDC_READER_READER2_OFFSETSTORAGETOPICNAME: consumer_schema.cdc_offset_store
      EVENTUATE_CDC_READER_READER2_OUTBOXID: "2"
      EVENTUATE_CDC_READER_READER2_MONITORINGSCHEMA: public
      # Kitchen Service database pipeline
      EVENTUATE_CDC_PIPELINE_PIPELINE3_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE3_READER: reader3
      EVENTUATE_CDC_PIPELINE_PIPELINE3_EVENTUATEDATABASESCHEMA: public

      # Reader 3 - Kitchen Service database
      EVENTUATE_CDC_READER_READER3_TYPE: postgres-wal
      EVENTUATE_CDC_READER_READER3_DATASOURCEURL: jdbc:postgresql://kitchen-service-db:5432/eventuate
      EVENTUATE_CDC_READER_READER3_DATASOURCEUSERNAME: postgresuser
      EVENTUATE_CDC_READER_READER3_DATASOURCEPASSWORD: postgrespw
      EVENTUATE_CDC_READER_READER3_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER3_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/kitchen
      EVENTUATE_CDC_READER_READER3_OFFSETSTORAGETOPICNAME: kitchen_schema.cdc_offset_store
      EVENTUATE_CDC_READER_READER3_OUTBOXID: "3"
      EVENTUATE_CDC_READER_READER3_MONITORINGSCHEMA: public
      # Accounting Service database pipeline
      EVENTUATE_CDC_PIPELINE_PIPELINE4_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE4_READER: reader4
      EVENTUATE_CDC_PIPELINE_PIPELINE4_EVENTUATEDATABASESCHEMA: public

      # Reader 4 - Accounting Service database
      EVENTUATE_CDC_READER_READER4_TYPE: postgres-wal
      EVENTUATE_CDC_READER_READER4_DATASOURCEURL: jdbc:postgresql://accounting-service-db:5432/eventuate
      EVENTUATE_CDC_READER_READER4_DATASOURCEUSERNAME: postgresuser
      EVENTUATE_CDC_READER_READER4_DATASOURCEPASSWORD: postgrespw
      EVENTUATE_CDC_READER_READER4_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER4_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/accounting
      EVENTUATE_CDC_READER_READER4_OFFSETSTORAGETOPICNAME: accounting_schema.cdc_offset_store
      EVENTUATE_CDC_READER_READER4_OUTBOXID: "4"
      EVENTUATE_CDC_READER_READER4_MONITORINGSCHEMA: public
      # Restaurant Service database pipeline
      EVENTUATE_CDC_PIPELINE_PIPELINE5_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE5_READER: reader5
      EVENTUATE_CDC_PIPELINE_PIPELINE5_EVENTUATEDATABASESCHEMA: public

      # Reader 5 - Restaurant Service database
      EVENTUATE_CDC_READER_READER5_TYPE: postgres-wal
      EVENTUATE_CDC_READER_READER5_DATASOURCEURL: jdbc:postgresql://restaurant-service-db:5432/eventuate
      EVENTUATE_CDC_READER_READER5_DATASOURCEUSERNAME: postgresuser
      EVENTUATE_CDC_READER_READER5_DATASOURCEPASSWORD: postgrespw
      EVENTUATE_CDC_READER_READER5_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER5_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/restaurant
      EVENTUATE_CDC_READER_READER5_OFFSETSTORAGETOPICNAME: restaurant_schema.cdc_offset_store
      EVENTUATE_CDC_READER_READER5_OUTBOXID: "5"
      EVENTUATE_CDC_READER_READER5_MONITORINGSCHEMA: public
      # Delivery Service database pipeline
      EVENTUATE_CDC_PIPELINE_PIPELINE6_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE6_READER: reader6
      EVENTUATE_CDC_PIPELINE_PIPELINE6_EVENTUATEDATABASESCHEMA: public

      # Reader 6 - Delivery Service database
      EVENTUATE_CDC_READER_READER6_TYPE: postgres-wal
      EVENTUATE_CDC_READER_READER6_DATASOURCEURL: jdbc:postgresql://delivery-service-db:5432/eventuate
      EVENTUATE_CDC_READER_READER6_DATASOURCEUSERNAME: postgresuser
      EVENTUATE_CDC_READER_READER6_DATASOURCEPASSWORD: postgrespw
      EVENTUATE_CDC_READER_READER6_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER6_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/delivery
      EVENTUATE_CDC_READER_READER6_OFFSETSTORAGETOPICNAME: delivery_schema.cdc_offset_store
      EVENTUATE_CDC_READER_READER6_OUTBOXID: "6"
      EVENTUATE_CDC_READER_READER6_MONITORINGSCHEMA: public
    depends_on:
      - kafka
      - order-service-db
      - consumer-service-db
      - kitchen-service-db
      - accounting-service-db
      - restaurant-service-db
      - delivery-service-db

  ftgo-consumer-service:
    build:
      context: ./ftgo-consumer-service
      args:
        baseImageVersion: "0.21.0.BUILD-SNAPSHOT"
    ports:
      - "8082:8080"
