                -f description="$review_description" -f target_url="$DASHBOARD_URL" >/dev/null
              acceptance=$(jq -r '.acceptance.status // "legacy"' <<<"$document")
              mode=$(jq -r '.acceptance.mode // "shadow"' <<<"$document")
              # A completed run cannot gain evidence by keeping a runner alive.
              # Finish now; after the missing evidence or review is supplied, rerun.
              if [ "$mode" = "enforce" ] && [ "$acceptance" != "ready" ]; then
                reason=$(jq -r '.acceptance.reason // "Required governance acceptance is not ready"' <<<"$document")
