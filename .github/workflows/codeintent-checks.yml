              required=$(jq -r '.finding_review_gate.required // 0' <<<"$document")
              accepted=$(jq -r '.finding_review_gate.accepted // 0' <<<"$document")
              if [ "$gate_status" = ready ] || [ "$gate_status" = not_required ]; then
                review_state=success
