name: CodeIntent Checks

# This trusted base-branch workflow never checks out or executes PR code.
# It downloads the textual diff for TypeSafe and lets the Lambda run checks.
#
# Coding standards: the soft rules are governed in hss_idiom_forge and bundled into
# the Lambda image, so a PR cannot change the rules it is checked against. This
# workflow only sends the changed Java files, fetched as text at the head SHA
# through the API (never executed), so the Lambda can judge whole methods.
#
# Rule exceptions: a GitHub-verified Yes on a coding-standards finding, on the
# review page, records the exception in the governance ledger and starts this
# workflow for the PR. The Lambda applies it to this PR at once, and to every PR
# once this one merges (codeintent-rule-exceptions.yml). The repository's own
# .codeintent/rule-exceptions.yaml still applies: its text at the base and at the
# head is sent, and an entry the PR adds counts only with a recorded decision.
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to check
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: codeintent-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.CODEINTENT_API_URL || 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/verify-checks' }}
      STATUS_API_URL: ${{ vars.CODEINTENT_STATUS_API_URL || 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/status' }}
      STATUS_PAGE_URL: ${{ vars.CODEINTENT_STATUS_PAGE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      FTGO_DEMO_REPOSITORIES: scottswindell-hub/ftgo-application,Holonic-Technologies/ftgo-application
      API_KEY: ${{ secrets.DRIFT_GATE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PR_OWNER: ${{ github.repository_owner }}
      PR_REPO: ${{ github.event.repository.name }}
      PR_FULL_REPO: ${{ github.repository }}

    steps:
      # The PR's details come from the API, for a PR event and a manual run alike.
      - name: Resolve the pull request
        env:
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/$PR_FULL_REPO/pulls/$REQUESTED_PR" > /tmp/pull-request.json
          if [ "$(jq -r .state /tmp/pull-request.json)" != open ]; then
            echo "::error::Pull request #$REQUESTED_PR is not open."
            exit 1
          fi
          jq -r '"PR_SHA=\(.head.sha)", "PR_BASE_SHA=\(.base.sha)", "PR_BASE_REF=\(.base.ref)",
                 "PR_HEAD_REF=\(.head.ref)", "PR_NUMBER=\(.number)"' /tmp/pull-request.json >> "$GITHUB_ENV"
          { echo 'PR_TITLE<<CODEINTENT_TITLE_EOF'; jq -r .title /tmp/pull-request.json; echo 'CODEINTENT_TITLE_EOF'; } >> "$GITHUB_ENV"

      - name: Publish analysis progress
        run: |
          set -euo pipefail
          dashboard_url=$(python3 -c 'import os,urllib.parse; print(os.environ["STATUS_PAGE_URL"].rstrip("/") + "/?" + urllib.parse.urlencode({"sha":os.environ["PR_SHA"],"api":os.environ["STATUS_API_URL"].rsplit("/status",1)[0],"pr":os.environ["PR_NUMBER"],"repo":os.environ["PR_FULL_REPO"]}))')
          echo "DASHBOARD_URL=$dashboard_url" >> "$GITHUB_ENV"
          gh api --method POST "repos/$PR_FULL_REPO/statuses/$PR_SHA" \
            -f state=pending -f context='CodeIntent / Finding review' \
            -f description='Analysis and finding review are in progress' \
            -f target_url="$dashboard_url" >/dev/null
          marker='<!-- codeintent-checks -->'
          body="$marker
          ### CodeIntent checks

          ## <img src=\"${STATUS_PAGE_URL%/}/assets/checks-running.gif\" width=\"28\" height=\"28\" alt=\"Checks running\"> Analysis in progress

          Review links will appear when analysis finishes."
          comment_id=$(gh api "repos/$PR_FULL_REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -1 || true)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$PR_FULL_REPO/issues/comments/$comment_id" -f body="$body" >/dev/null || \
              echo "::warning::Could not update the live-status PR comment."
          else
            gh api --method POST "repos/$PR_FULL_REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null || \
              echo "::warning::Could not create the live-status PR comment."
          fi

      - name: Start dependency-aware checks
        run: |
          set -euo pipefail
          if [ -z "$API_KEY" ]; then
            echo "::error::Configure the DRIFT_GATE_API_KEY repository secret."
            exit 1
          fi

          # A rerun of this exact workflow can finish an authorized review without
          # running detectors or acquiring judgments again. The report link is read-only.
          # Unless the head is marked recheck_requested (for example once a fixed rule
          # is live): then the checks run again against the current rules.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            prior=$(curl -fsS --get "$STATUS_API_URL" \
              --data-urlencode "sha=$PR_SHA" --data-urlencode "repo=$PR_FULL_REPO" || true)
            if printf '%s' "$prior" | jq -e --arg sha "$PR_SHA" \
                 '.state == "completed" and .pipeline == "typesafe-checks-v1" and
                  .sha == $sha and (.governance_run_id | type == "string" and length > 0) and
                  (.recheck_requested | not) and .verdict != "UNKNOWN" and
                  ([.checks[]? | select(.state == "error")] | length == 0)' >/dev/null; then
              echo "Resuming acceptance for the completed run; checks will not rerun."
              exit 0
            fi
          fi

          previous_started_at=$(curl -fsS --get "$STATUS_API_URL" \
            --data-urlencode "sha=$PR_SHA" --data-urlencode "repo=$PR_FULL_REPO" \
            | jq -r '.started_at // empty' || true)
          echo "PREVIOUS_STARTED_AT=$previous_started_at" >> "$GITHUB_ENV"

          gh api -H 'Accept: application/vnd.github.v3.diff' \
            "repos/$PR_FULL_REPO/pulls/$PR_NUMBER" > /tmp/pr.diff

          # Coding-standards input. Everything here is fetched as text through
          # the API and only forwarded; nothing from the PR is executed.
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from urllib.parse import quote

          repo = os.environ["PR_FULL_REPO"]
          sha = os.environ["PR_SHA"]
          max_file = int(os.environ.get("STANDARDS_MAX_FILE_BYTES", "60000"))
          # API Gateway invokes the Lambda asynchronously, so the whole request
          # (diff included) must fit the much smaller async payload limit.
          max_total = int(os.environ.get("STANDARDS_MAX_TOTAL_BYTES", "200000"))


          class NotFound(Exception):
              pass


          def gh(*args):
              run = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if run.returncode != 0:
                  if "HTTP 404" in run.stderr:
                      raise NotFound()
                  sys.exit(f"::error::GitHub API request failed: {run.stderr.strip()[:200]}")
              return run.stdout


          def raw(path, ref):
              return gh("-H", "Accept: application/vnd.github.raw",
                        f"repos/{repo}/contents/{quote(path)}?ref={quote(ref, safe='')}")


          files, omitted, total = {}, [], 0
          raw_pages = json.loads(gh(
              "--paginate", "--slurp",
              f"repos/{repo}/pulls/{os.environ['PR_NUMBER']}/files?per_page=100",
          ))
          changed_rows = [row for page in raw_pages for row in page]
          pr_stats = json.loads(gh(f"repos/{repo}/pulls/{os.environ['PR_NUMBER']}"))
          change_stats = {key: pr_stats[key] for key in ('additions', 'deletions', 'changed_files')}
          change_stats['files'] = [{'path': row['filename'], 'additions': row['additions'],
                                   'deletions': row['deletions'], 'status': row['status']}
                                  for row in changed_rows]
          semantic_java = []
          for row in changed_rows:
              path = row["filename"]
              status = row["status"]
              if status == "renamed":
                  previous = row.get("previous_filename")
                  if previous and previous.endswith(".java"):
                      semantic_java.append({"path": previous, "status": "removed"})
                  if not path.endswith(".java"):
                      continue
                  status = "added"
              elif not path.endswith(".java"):
                  continue
              status = {"changed": "modified", "copied": "added"}.get(status, status)
              semantic_java.append({"path": path, "status": status})
              if status == "removed":
                  continue
              try:
                  text = raw(path, sha)
              except NotFound:
                  omitted.append(path)
                  continue
              size = len(text.encode("utf-8"))
              if size > max_file or total + size > max_total:
                  omitted.append(path)
                  continue
              files[path] = text
              total += size

          def optional(path, ref):
              try:
                  return raw(path, ref)
              except NotFound:
                  return None

          # The repository's own rule exceptions, at the base and at the head.
          exceptions_path = ".codeintent/rule-exceptions.yaml"
          exceptions = {"base": optional(exceptions_path, os.environ["PR_BASE_SHA"]),
                        "head": optional(exceptions_path, sha)}

          with open("/tmp/standards-input.json", "w", encoding="utf-8") as stream:
              json.dump({
                  "standards": {"files_omitted": omitted, "exceptions": exceptions},
                  "semantic_changes": {"java": semantic_java, "files_omitted": omitted},
                  "pr_change_stats": change_stats,
                  "files": files,
              }, stream)
          print(f"Standards input: {len(files)} changed Java file(s) sent, {len(omitted)} omitted.")
          PY

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/pr.diff", encoding="utf-8", errors="replace") as stream:
              diff = stream.read()
          with open("/tmp/standards-input.json", encoding="utf-8") as stream:
              standards_input = json.load(stream)
          payload = {
              "pipeline": "typesafe-checks-v1",
              "owner": os.environ["PR_OWNER"],
              "repo": os.environ["PR_REPO"],
              "sha": os.environ["PR_SHA"],
              "base_sha": os.environ["PR_BASE_SHA"],
              "diff": diff,
              "base_ref": os.environ["PR_BASE_REF"],
              "pr_ref": os.environ["PR_HEAD_REF"],
              "pull_request_number": int(os.environ["PR_NUMBER"]),
              "pull_request_title": os.environ["PR_TITLE"],
              **standards_input,
          }
          import hashlib
          payload['fallback_diff_ref'] = {
              'repository': os.environ['PR_FULL_REPO'], 'base_sha': payload['base_sha'],
              'head_sha': payload['sha'], 'sha256': hashlib.sha256(diff.encode('utf-8')).hexdigest(),
              'bytes': len(diff.encode('utf-8')), 'files': payload['pr_change_stats']['changed_files'],
          }
          if len(json.dumps(payload).encode('utf-8')) > 240000:
              # Keep complete size metadata; do not pretend a clipped diff was analyzed.
              excerpt = payload.get('diff', '')[:24000]
              while len(json.dumps(excerpt).encode('utf-8')) > 24000:
                  excerpt = excerpt[:len(excerpt) // 2]
              payload['fallback_diff'] = excerpt
              payload.update(diff='', files={}, reviewability_only=True,
                             standards={}, semantic_changes={})
              if len(json.dumps(payload).encode('utf-8')) > 240000:
                  payload['pr_change_stats']['files'] = []
          with open("/tmp/codeintent-payload.json", "w", encoding="utf-8") as stream:
              json.dump(payload, stream)
          PY

          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/codeintent-response.json -w '%{http_code}' \
              -X POST "$API_URL" -H 'Content-Type: application/json' \
              -H "x-api-key: $API_KEY" -d @/tmp/codeintent-payload.json)
            case "$code" in
              200|202)
                echo "CodeIntent checks started."
                break
                ;;
              403|429|5??)
                if [ "$attempt" -lt 5 ]; then
                  echo "Gateway returned HTTP $code; retrying ($attempt/5)..."
                  sleep $((attempt * 2))
                  continue
                fi
                ;;
            esac
            cat /tmp/codeintent-response.json
            echo "HTTP $code"
            exit 1
          done

      - name: Wait for check result
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 840))
          while (( SECONDS < deadline )); do
            document=$(curl -fsS --get "$STATUS_API_URL" \
              --data-urlencode "sha=$PR_SHA" --data-urlencode "repo=$PR_FULL_REPO" || true)
            if [ -z "$document" ]; then document='{}'; fi
            state=$(jq -r '.state // "absent"' <<<"$document")
            started_at=$(jq -r '.started_at // empty' <<<"$document")
            pipeline=$(jq -r '.pipeline // empty' <<<"$document")

            if { [ "$started_at" = "${PREVIOUS_STARTED_AT:-}" ] && [ -n "$started_at" ]; } || \
               { [ "$state" = "completed" ] && [ "$pipeline" != "typesafe-checks-v1" ]; }; then
              echo "Waiting for this run to replace the prior result..."
            elif [ "$state" = "completed" ]; then
              verdict=$(jq -r '.verdict // "UNKNOWN"' <<<"$document")
              revision=$(printf '%s' "$document" | sha256sum | cut -d ' ' -f 1)
              if [ "$revision" != "${last_document_revision:-}" ]; then
              last_document_revision=$revision
              jq -r '.checks[]? | "\(.label): \(.state) — \(.detail // "")"' <<<"$document"
              # Coding-standards findings never fail the job by themselves;
              # they are listed so the author can respond.
              findings=$(jq -r '.checks[]? | select(.id == "coding_standards") | .findings[]? |
                "- **\(if .band == "finding" then "Finding" else "FYI" end)** [\(.severity)\(if (.category // "") == "" then "" elif (.category_parent // "") == "" then " · \(.category)" else " · \(.category_parent) › \(.category)" end)] \(.rule_id) v\(.rule_version) \(.name): `\(.file):\(.line)` \(.unit)" +
                (if .guidance != "" then "\n  Suggested fix: \(.guidance)" else "" end) +
                (if .ref and $recorded then "\n  Intended? Answer Yes or No on the CodeIntent review page (`\(.ref)`)." else "" end)' \
                --argjson recorded "$(jq '(.governance_run_id // "") != ""' <<<"$document")" <<<"$document")
              if [ -n "$findings" ]; then
                printf '%s\n' "$findings"
                {
                  echo "### Coding standards"
                  echo
                  echo "Findings are rule violations and fail the check; FYIs need no response."
                  echo
                  printf '%s\n' "$findings"
                  echo
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              # Other failed checks' violations are decided the same way.
              others=$(jq -r 'select((.governance_run_id // "") != "") | .checks[]? | select(.id != "coding_standards" and .state == "failed") | . as $check | .findings[]? | select(.ref) |
                "- **\($check.label // $check.id)**: \(.name // .title // .observation // "finding") (`\(.ref)`)"' <<<"$document")
              if [ -n "$others" ]; then
                {
                  echo "### Rule violations"
                  echo
                  echo "Answer each on the CodeIntent review page: Yes if the change was intended, No to keep this PR blocked."
                  echo
                  printf '%s\n' "$others"
                  echo
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "[Open the live report ↗]($DASHBOARD_URL)" >> "$GITHUB_STEP_SUMMARY"
              printf '%s' "$document" > /tmp/codeintent-status.json
              comment_id=$(gh api "repos/$PR_FULL_REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- codeintent-checks -->"))) | .id' | head -1 || true)
              export CODEINTENT_COMMENT_ID="$comment_id"
              python3 <<'PY' > /tmp/codeintent-comment.md
          """One compact GitHub comment over native results and separate acceptance policy."""
          import os
          from html import escape
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          
          MARKER = '<!-- codeintent-checks -->'
          ICONS = {'passed':'✅','failed':'❌','error':'⚠️','stopped':'➖','blocked':'➖','pending':'⏳','running':'⏳'}
          DEFAULT_FTGO_REPOSITORIES = ('scottswindell-hub/ftgo-application',
                                       'Holonic-Technologies/ftgo-application')
          
          
          def ftgo_repository(repository):
              configured = os.environ.get('FTGO_DEMO_REPOSITORIES')
              allowed = DEFAULT_FTGO_REPOSITORIES if configured is None else tuple(
                  value.strip() for value in configured.split(',') if value.strip())
              return repository in allowed
          
          
          def inline(value):
              return str(value or '').replace('\n',' ').replace('|','\\|').replace('<','&lt;').replace('>','&gt;')[:300]
          
          
          def finding_lines(check, limit=10):
              """One line per published finding, with its reference (`F-…`)."""
              lines=[]
              findings=[f for f in check.get('findings') or [] if isinstance(f,dict) and f.get('ref')]
              for finding in findings[:limit]:
                  what=finding.get('rule_id') or finding.get('name') or finding.get('title') or finding.get('observation') or 'finding'
                  where=f" at `{inline(finding['file'])}:{inline(finding.get('line'))}`" if finding.get('file') else ''
                  status=' (false positive: rule exception added to this PR)' if finding.get('decision')=='rule_change_requested' else ''
                  lines.append(f"  - `{finding['ref']}` {inline(what)}{where}{status}")
              if len(findings)>limit:
                  lines.append(f"  - …and {len(findings)-limit} more on the report")
              return lines
          
          
          def review_lines(check, report_url, accepted=None):
              lines=[]
              for finding in check.get('findings') or []:
                  review=finding.get('review') or {}
                  decision=review.get('decision')
                  if accepted is not None and (decision=='accepted') != accepted:
                      continue
                  icon='✅ ' if decision=='accepted' else '❌ ' if decision=='unresolved' else ''
                  label=inline(finding.get('title') or finding.get('name') or finding.get('rule_id') or 'Finding')
                  issue=finding.get('id') or finding.get('ref')
                  url=urlsplit(report_url)
                  query=[(k,v) for k,v in parse_qsl(url.query,keep_blank_values=True) if k not in {'view','check','issue','item'}]
                  query.extend([('view','desc'),('check',check['id']),('issue',issue or '')])
                  target=urlunsplit((url.scheme,url.netloc,url.path,urlencode(query),''))
                  suffix=(' — intended; governance violation remains' if finding.get('category')=='governed_boundary_violation' else ' — intended, recorded') if decision=='accepted' else ' — unresolved' if decision=='unresolved' else ' — needs review'
                  if finding.get('sema_id'):
                      description = ' '.join(str(finding.get('sema_description') or
                          ((finding.get('title') or finding.get('name') or 'Finding') + ' — English description unavailable')).split())
                      excerpt = description if len(description) <= 100 else description[:97].rsplit(' ', 1)[0].rstrip() + '...'
                      text = finding['sema_id'] + ' -- ' + excerpt
                      # GitHub permits link title attributes; all provider text is inert.
                      link = f'<a href="{escape(target, quote=True)}" title="{escape(description, quote=True)}">{escape(text)}</a>'
                      ending = suffix if decision in {'accepted', 'unresolved'} else ''
                      lines.append(f'- {icon}{link}{ending}')
                  else:
                      lines.append(f'- {icon}[{label}](<{target}>){suffix}')
                  if decision in {'accepted','unresolved'}:
                      lines.append(f"  <!-- codeintent-review:{review['scope']}:{decision}:{review['record']} -->")
              return lines
          
          
          def review_pending(check):
              findings=check.get('findings') or []
              return any(f.get('review') for f in findings) and not reviewed(check)
          
          
          def reviewed(check):
              findings=check.get('findings') or []
              return bool(findings) and check.get('state') in {'passed','failed'} and all(
                  (f.get('review') or {}).get('decision')=='accepted' for f in findings)
          
          
          def boundary_summary(check):
              """Failed boundary questions need review, not a list: the count here, the findings in the review."""
              findings=[f for f in check.get('findings') or [] if isinstance(f,dict) and (f.get('review') or {}).get('decision')!='accepted']
              if not findings:
                  return 'needs review'
              boundaries=len({f['title'] for f in findings if f.get('title')})
              across=f" across {boundaries} governed boundar{'y' if boundaries==1 else 'ies'}" if boundaries else ''
              return f"needs review — {len(findings)} finding{'' if len(findings)==1 else 's'}{across}"
          
          
          def demo_evidence_gap(check):
              return (check.get('id') == 'connected_evidence' and check.get('state') == 'error'
                      and 'required evidence gap(s)' in check.get('detail', ''))
          
          
          def render_run_comment(document, report_url):
              if urlsplit(report_url).scheme not in {'http','https'}:
                  raise ValueError('Report URL must be HTTP(S)')
              comment_id=str(document.get('github_comment_id') or '')
              if comment_id.isdigit():
                  url=urlsplit(report_url)
                  query=[(key,value) for key,value in parse_qsl(url.query,keep_blank_values=True) if key!='comment']
                  report_url=urlunsplit((url.scheme,url.netloc,url.path,urlencode([*query,('comment',comment_id)]),url.fragment))
              checks=document.get('checks') or document.get('stages') or []
              hidden=[c for c in checks if ftgo_repository(document.get('repo')) and demo_evidence_gap(c)]
              checks=[{**c, 'findings': [f for f in c.get('findings') or [] if f.get('band') != 'fyi']}
                      if c.get('id') == 'coding_standards' else c for c in checks if c not in hidden]
              verdict=document.get('verdict')
              acceptance=document.get('acceptance') or {}
              status=acceptance.get('status')
              shadow=acceptance.get('mode')=='shadow'
              visible=[c for c in checks if c.get('id')!='governance_decision']
              failures=[c for c in visible if c.get('state') in {'failed','error'}]
              all_reviewed=bool(failures) and all(reviewed(c) for c in failures)
              needs_review=((verdict!='PASS' and not all_reviewed and not hidden) or any(not reviewed(c) for c in failures) or any(review_pending(c) for c in visible)
                            or (not shadow and status in {'blocked','review_required','incomplete','evidence_needed'}))
              label=('⏳ Running' if document.get('state')!='completed' else
                     '⚠️ LACKS_DETERMINISTIC_EVIDENCE' if needs_review and verdict=='UNKNOWN' else
                     '❌ Needs Review' if needs_review else '✅ Reviewed' if all_reviewed else 'Review results' if hidden else '✅ Passed')
              rows=[MARKER,'### CodeIntent checks -- '+label,'']
              if document.get('violation_status')=='rejected':
                  rows+=['**Rejected:** a rule violation was confirmed, so this pull request was closed.','']
              fallback = document.get('llm_review') or {}
              if fallback:
                  rows += ['**LLM analysis · not deterministically verified**',
                           'Advisory only; deterministic checks and approval requirements are unchanged.', '']
                  coverage = fallback.get('coverage') or {}
                  if coverage:
                      rows += [inline(fallback.get('evidence_scope', '')),
                               f"Diff coverage: {inline(coverage.get('input_files'))} files; {inline(coverage.get('submitted_bytes'))} bytes submitted; {inline(fallback.get('status'))}.", '']
                  for issue in fallback.get('issues', []):
                      rows += ['- Potential issue: ' + escape(str(issue.get('title', ''))),
                               '  ' + escape(str(issue.get('explanation', ''))),
                               '  Uncertainty: ' + escape(str(issue.get('uncertainty', '')))]
                  if not fallback.get('issues'):
                      rows += [inline(fallback.get('reason') or 'No potential issues returned; this does not establish that the PR is safe.')]
                  rows += ['']
              accepted=[]
              passed=[]
              failed=[]
              failed_count=0
              for check in checks:
                  notice=check.get('reviewability') or {}
                  if notice and notice.get('band')!='normal':
                      rows += [f"🟡 **PR reviewability:** {inline(notice.get('message'))}",
                               f"Counted size: {inline(notice.get('analysis_lines'))} lines across {inline(notice.get('changed_files'))} files; {inline(notice.get('mode'))} policy.", '']
                  if check.get('id')=='governance_decision':
                      continue
                  state=check.get('state','pending')
                  name=inline(check.get('label') or check['id'])
                  has_reviews=any(f.get('review') or f.get('sema_id') for f in check.get('findings') or [])
                  if reviewed(check):
                      accepted+=review_lines(check,report_url)
                  elif state=='passed' and not review_pending(check):
                      suffix=' — response requested' if check.get('id')=='coding_standards' and check.get('findings') and not reviewed(check) else ''
                      passed.append(f'- {name}{suffix}')
                      passed+=review_lines(check,report_url) if has_reviews else finding_lines(check) if document.get('governance_run_id') else []
                  elif state in {'failed','error'} or review_pending(check):
                      failed_count+=sum((f.get('review') or {}).get('decision')!='accepted' for f in check.get('findings') or []) if has_reviews else 1
                      detail=boundary_summary(check) if check.get('id')=='intent_diff' and state=='failed' else 'response requested' if state=='passed' else inline(state)
                      url=urlsplit(report_url)
                      query=[(key,value) for key,value in parse_qsl(url.query,keep_blank_values=True) if key not in {'view','check','item','issue'}]
                      query.extend([('view','desc'),('check',check['id'])])
                      issues=[f for f in check.get('findings') or [] if isinstance(f,dict) and (f.get('review') or {}).get('decision')!='accepted']
                      if issues:
                          issue=issues[0].get('id') or issues[0].get('ref')
                          if issue: query.append(('issue',issue))
                      target=urlunsplit((url.scheme,url.netloc,url.path,urlencode(query),''))
                      if not has_reviews:
                          failed.append(f'- **[{name}](<{target}>)**: {detail}')
                      if has_reviews:
                          failed+=review_lines(check,report_url)
                      elif check.get('id')!='intent_diff' and document.get('governance_run_id'):
                          failed+=finding_lines(check)
              passed_count=sum(check.get('state')=='passed' and check.get('id')!='governance_decision' and not review_pending(check) and not reviewed(check) for check in checks)
              if passed:
                  rows+=['<details>', '<summary>✅ Passing checks</summary>', '',
                         *passed, '', '</details>']
              if accepted and failed:
                  failed=accepted+failed
                  accepted=[]
              if accepted:
                  rows+=['<details open>', '<summary>✅ Resolved findings</summary>', '', *accepted, '', 'Intent answers recorded; analysis results and accepted governance are unchanged.', '', '</details>']
              if failed:
                  rows+=['<details open>', '<summary>❌ Needs Review</summary>', '',
                         *failed, '', '</details>', '']
              risks=(acceptance.get('intent_risks') or {}).get('assessments',[])
              if risks:
                  rows+=['',f"🟡 Intent outside governed objectives: {len(risks)} change(s); {len(acceptance.get('required_reviews',[]))} awaiting risk review."]
              return '\n'.join(rows)+'\n'

