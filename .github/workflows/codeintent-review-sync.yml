name: Update CodeIntent review message
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: FTGO pull request number
        required: true
        type: number
      head_sha:
        description: Reviewed source commit
        required: true
        type: string
      exceptions:
        description: Rule exceptions a GitHub-verified Yes recorded (JSON from the review API)
        required: false
        type: string
        default: ''
permissions:
  contents: write        # commit a rule exception to the PR branch
  actions: write         # re-run CodeIntent Checks on that commit
  issues: write
  pull-requests: write
  statuses: write
concurrency:
  group: codeintent-review-sync-${{ inputs.pull_request }}
  cancel-in-progress: false
jobs:
  update:
    if: contains(fromJSON('["scottswindell-hub/ftgo-application","Holonic-Technologies/ftgo-application"]'), github.repository) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh the bot message from recorded review decisions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import urlencode
          repo, number, sha = os.environ['REPOSITORY'], os.environ['PR_NUMBER'], os.environ['HEAD_SHA']
          if not number.isdigit() or int(number) < 1 or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid PR or commit identity')
          def github(path, method='GET', body=None):
              request = urllib.request.Request('https://api.github.com' + path, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          def current():
              pr = github(f'/repos/{repo}/pulls/{number}')
              return pr['state'] == 'open' and pr['head']['sha'] == sha
          if not current():
              raise SystemExit('PR changed or closed; refusing a stale message update')
          bot = None
          for page in range(1, 11):
              comments = github(f'/repos/{repo}/issues/{number}/comments?per_page=100&page={page}')
              bot = next((c for c in comments if c.get('user', {}).get('login') == 'github-actions[bot]'
                          and '<!-- codeintent-checks -->' in c.get('body', '')), None)
              if bot or len(comments) < 100:
                  break
          # Keep findings visible while Lambda renders the updated review projection.
          pending = None
          if not current():
              raise SystemExit('PR changed before refresh; refusing a stale message update')
          if bot:
              owner, name = repo.split('/', 1)
              spinner = f'<img src="https://{owner.lower()}.github.io/{name}/assets/checks-running.gif" width="20" height="20" alt="Updating review">'
              heading = '### CodeIntent checks -- ' + spinner + ' Updating review…'
              pending = re.sub(r'^### CodeIntent checks[^\n]*', lambda _: heading, bot['body'], count=1, flags=re.MULTILINE)
              if pending == bot['body']:
                  pending = bot['body'] + '\n\n' + heading
              github(f'/repos/{repo}/issues/comments/{bot["id"]}', 'PATCH', {'body': pending})
          try:
              query = {'repo': repo, 'sha': sha, 'detail': 'review-comment'}
              if bot:
                  query['comment'] = str(bot['id'])
              url = 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/status?' + urlencode(query)
              with urllib.request.urlopen(url, timeout=30) as response:
                  document = json.load(response)
              if document.get('head_sha') != sha or document.get('pull_request') != int(number) or not current():
                  raise SystemExit('Review identity changed; reload the current PR')
              body = document['body']
              if '<!-- codeintent-checks -->' not in body:
                  raise SystemExit('Missing authenticated review projection')
              if bot:
                  github(f'/repos/{repo}/issues/comments/{bot["id"]}', 'PATCH', {'body': body})
              else:
                  github(f'/repos/{repo}/issues/{number}/comments', 'POST', {'body': body})
              gate = document.get('finding_review_gate') or {}
              if (gate.get('application') != repo or gate.get('pull_request') != int(number)
                      or gate.get('head_commit') != sha):
                  raise SystemExit('Missing exact finding-review merge gate')
              status = gate.get('status')
              required, accepted = gate.get('required', 0), gate.get('accepted', 0)
              state = 'success' if status in {'ready', 'not_required'} else 'error' if status == 'unavailable' else 'failure'
              description = (f'All {required} review finding(s) accepted for this evidence'
                             if state == 'success' else 'Finding-review authority is unavailable'
                             if state == 'error' else f'{accepted} of {required} review finding(s) accepted')
              owner, name = repo.split('/', 1)
              report = f'https://{owner.lower()}.github.io/{name}/?' + urlencode(
                  {'repo': repo, 'pr': number, 'sha': sha,
                   'api': 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo'})
              github(f'/repos/{repo}/statuses/{sha}', 'POST', {
                  'state': state, 'context': 'CodeIntent / Finding review',
                  'description': description[:140], 'target_url': report})
          except (Exception, SystemExit):
              # Do not leave a spinner forever, or overwrite a newer pipeline comment.
              if bot and pending:
                  latest = github(f'/repos/{repo}/issues/comments/{bot["id"]}')
                  if latest.get('body') == pending:
                      failed = pending.replace(heading, '### CodeIntent checks -- ⚠️ Review update incomplete; retry from the review page', 1)
                      github(f'/repos/{repo}/issues/comments/{bot["id"]}', 'PATCH', {'body': failed})
              raise
          print('CodeIntent bot message updated from recorded review decisions.')
          PY
      # A Yes on a coding-standards finding: the API has recorded the false positive in the
      # governance ledger. Commit its exception to the PR branch as a separate commit and
      # re-run the checks; they trust the entry only because the ledger holds that decision.
      - name: Commit rule exceptions to the PR branch
        if: inputs.exceptions != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          EXCEPTIONS: ${{ inputs.exceptions }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, urllib.error, urllib.request
          from urllib.parse import quote
          repo, number, sha = os.environ['REPOSITORY'], os.environ['PR_NUMBER'], os.environ['HEAD_SHA']
          if not number.isdigit() or int(number) < 1 or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid PR or commit identity')
          request = json.loads(os.environ['EXCEPTIONS'])
          path, header, entries = request['file'], request['header'], request['entries']
          if path != '.codeintent/rule-exceptions.yaml' or not isinstance(entries, list) or not 0 < len(entries) <= 20:
              raise SystemExit('Unexpected rule exception request')
          for entry in entries:
              if not (isinstance(entry.get('yaml'), str) and entry['yaml'].startswith('  - rule: ') and len(entry['yaml']) <= 4000
                      and re.fullmatch(r'F-[0-9a-f]{8}', str(entry.get('finding'))) and re.fullmatch(r'[A-Z0-9-]{1,40}', str(entry.get('rule')))):
                  raise SystemExit('Unexpected rule exception entry')
          def github(path, method='GET', body=None):
              request = urllib.request.Request('https://api.github.com' + path, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}
          text = ''.join(entry['yaml'] for entry in entries)
          pr = github(f'/repos/{repo}/pulls/{number}')
          if pr['state'] != 'open' or pr['head']['sha'] != sha:
              raise SystemExit('The PR changed or closed after the answer; the rule exception was not committed. '
                               'Answer Yes again on the current review.')
          if (pr['head'].get('repo') or {}).get('full_name') != repo:
              raise SystemExit(f'This PR comes from a fork, which this workflow cannot push to. Add this to `{path}` '
                               f'on the PR branch:\n{text}')
          branch = pr['head']['ref']
          try:
              current = github(f'/repos/{repo}/contents/{quote(path)}?ref={quote(branch, safe="")}')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              current = None
          content = base64.b64decode(current['content']).decode() if current else header
          if not content.endswith('\n'):
              content += '\n'
          added = [entry for entry in entries if entry['yaml'] not in content]
          if added:
              update = {'message': '; '.join(f"{e['rule']}: allow intended finding {e['finding']}" for e in added)
                                   + ' (confirmed on the CodeIntent review page)',
                        'branch': branch, 'content': base64.b64encode((content + ''.join(e['yaml'] for e in added)).encode()).decode()}
              if current:
                  update['sha'] = current['sha']
              github(f'/repos/{repo}/contents/{quote(path)}', 'PUT', update)
              print(f'Committed {len(added)} rule exception(s) to {path} on {branch}.')
          else:
              print(f'{path} on {branch} already has these rule exceptions.')
          # A commit made with GITHUB_TOKEN does not start workflows by itself.
          github(f'/repos/{repo}/actions/workflows/codeintent-checks.yml/dispatches', 'POST',
                 {'ref': os.environ['DEFAULT_BRANCH'], 'inputs': {'pull_request': number}})
          print('CodeIntent Checks re-run requested for the PR.')
          PY
