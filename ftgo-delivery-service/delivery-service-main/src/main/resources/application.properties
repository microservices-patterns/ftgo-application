spring.application.name=ftgo-delivery-service
management.endpoint.health.show-details=always

management.endpoints.web.exposure.include=health,prometheus,beans,endpoints

spring.jpa.generate-ddl=true
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.io.eventuate=DEBUG
logging.level.net.chrisrichardson.ftgo=DEBUG
logging.level.io.eventuate.tram=DEBUG

eventuate.database.schema=public

spring.datasource.url=jdbc:postgresql://localhost:5437/eventuate
spring.datasource.username=postgresuser
spring.datasource.password=postgrespw
spring.datasource.driver-class-name=org.postgresql.Driver

eventuatelocal.kafka.bootstrap.servers=localhost:9092

spring.flyway.locations=classpath:db/migration,classpath:flyway/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
