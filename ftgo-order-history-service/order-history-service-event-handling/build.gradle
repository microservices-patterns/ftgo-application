dependencies {
    api project(':order-history-service-domain')
    api project(':order-history-service-dynamodb')

    implementation 'io.eventuate.tram.core:eventuate-tram-spring-events-subscriber-starter'

    // Consumer contract test dependencies
    testImplementation 'io.eventuate.tram.core:eventuate-tram-spring-in-memory'
    testImplementation 'io.eventuate.tram.core:eventuate-tram-spring-commands'
    testImplementation 'io.eventuate.tram.testingsupport.springcloudcontract:eventuate-tram-spring-testing-support-cloud-contract'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'io.eventuate.util:eventuate-util-test'
    testImplementation 'io.eventuate.tram.core:eventuate-tram-test-util'
}

test {
    def repoDir = file("${rootProject.projectDir}/../build/repo").absolutePath
    systemProperty "stubrunner.repositoryRoot", "file://${repoDir}"
}
