plugins {
    id 'org.springframework.boot'
    id 'io.eventuate.plugins.gradle.testing.integration-tests'
    id 'io.eventuate.plugins.gradle.testing.component-tests'
}

dependencies {
    implementation project(':order-service-restapi')
    implementation project(':order-service-sagas')
    implementation project(':order-service-persistence')
    implementation project(':order-service-event-handling')

    implementation 'io.eventuate.tram.core:eventuate-tram-spring-jdbc-kafka'
    implementation 'io.eventuate.tram.core:eventuate-tram-spring-logging'
    implementation 'io.micrometer:micrometer-core'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.eventuate.tram.core:eventuate-tram-spring-flyway'
    implementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-flyway'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation testFixtures(project(':order-service-domain'))
    testImplementation 'io.eventuate.util:eventuate-util-test'

    // Integration test dependencies (from original build.gradle)
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation testFixtures(project(':order-service-domain'))
    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'io.eventuate.messaging.kafka:eventuate-messaging-kafka-testcontainers'
    integrationTestImplementation 'io.eventuate.common:eventuate-common-testcontainers'
    integrationTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-in-memory'
    integrationTestImplementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-testing-support'
    integrationTestImplementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-in-memory'
    integrationTestImplementation 'io.eventuate.tram.core:eventuate-tram-test-util'
    integrationTestImplementation 'org.postgresql:postgresql'

    // Component test dependencies
    componentTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    componentTestImplementation 'io.rest-assured:rest-assured'
    componentTestImplementation 'org.testcontainers:postgresql'
    componentTestImplementation 'org.testcontainers:junit-jupiter'
    componentTestImplementation 'org.testcontainers:testcontainers'
    componentTestImplementation 'io.eventuate.messaging.kafka:eventuate-messaging-kafka-testcontainers'
    componentTestImplementation 'io.eventuate.common:eventuate-common-testcontainers'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-commands-starter'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-jdbc-kafka'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-consumer-kafka'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-testing-support-producer-kafka'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-test-util'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-testing-support-outbox'
    componentTestImplementation 'io.eventuate.tram.core:eventuate-tram-testing-support'
    componentTestImplementation "io.eventuate.platform.testcontainer.support:eventuate-platform-testcontainer-support-service:$eventuatePlatformTestContainerSupportVersion"
    componentTestImplementation 'org.postgresql:postgresql'
    componentTestImplementation testFixtures(project(':order-service-domain'))

    // Cucumber dependencies
    componentTestImplementation 'io.cucumber:cucumber-java:7.15.0'
    componentTestImplementation 'io.cucumber:cucumber-junit:7.15.0'
    componentTestImplementation 'io.cucumber:cucumber-spring:7.15.0'

    // Saga testing support
    componentTestImplementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-testing-support'
    componentTestImplementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-testing-support'
}

bootJar {
    enabled = true
}
