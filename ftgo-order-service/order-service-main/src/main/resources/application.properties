spring.application.name=ftgo-order-service

# Actuator endpoints
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus,beans

# Logging
logging.level.org.springframework.cloud=INFO
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.io.eventuate=DEBUG
logging.level.net.chrisrichardson.ftgo=DEBUG
logging.level.io.eventuate.tram=DEBUG

# JPA Configuration
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DOCKER_HOST_IP:localhost}:5432/eventuate
spring.datasource.username=postgresuser
spring.datasource.password=postgrespw
spring.datasource.driver-class-name=org.postgresql.Driver

# Eventuate Configuration
eventuate.database.schema=public
eventuatelocal.kafka.bootstrap.servers=${DOCKER_HOST_IP:localhost}:9092

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:flyway/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
