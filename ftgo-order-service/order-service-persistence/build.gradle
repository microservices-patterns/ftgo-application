plugins {
    id 'io.eventuate.plugins.gradle.testing.integration-tests'
}

dependencies {
    api project(':order-service-domain')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'org.postgresql:postgresql'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation project(':order-service-domain').sourceSets.test.output
    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.postgresql:postgresql'
    integrationTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-consumer-jdbc'
}
